name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run it superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # No API key is set anywhere in this workflow. The default path must stay
  # free of paid calls (section 16), and the mock provider is what enforces it.
  TRACELENS_LLM_PROVIDER: mock

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[backend,dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest -q

  migrations:
    name: Migrations (SQLite and PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracelens
          POSTGRES_PASSWORD: tracelens
          POSTGRES_DB: tracelens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracelens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[backend,dev]" psycopg[binary]

      # The same migrations must apply to both backends (D-001). Running only
      # SQLite would let a Postgres-incompatible migration through, and running
      # only Postgres would let CI drift from what a developer runs locally.
      - name: Upgrade and downgrade on SQLite
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base

      - name: Upgrade on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://tracelens:tracelens@localhost:5432/tracelens
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: API health check against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://tracelens:tracelens@localhost:5432/tracelens
        run: |
          uvicorn app.main:app --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/health | tee /dev/stderr | grep -q '"database_ok":true'

  benchmark:
    name: Forensic benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[backend,dev]"

      # Exits non-zero if any healthy control was flagged, so a regression that
      # makes the engine noisier fails the build rather than quietly showing up
      # in a report nobody reads.
      - name: Run benchmark
        run: python -m benchmark.run --all --no-write --report benchmark-report.txt

      - name: Publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark-report.txt

      - name: Seed a demo database
        env:
          DATABASE_URL: sqlite:///./demo.db
        run: python -m benchmark.seed_demo --reset --questions 2
