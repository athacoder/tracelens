# Alembic configuration. The database URL is not stored here: it comes from
# DATABASE_URL via migrations/env.py, so the same migrations run against the
# local SQLite database and the PostgreSQL container without editing a file.
[alembic]
script_location = backend/migrations
prepend_sys_path = backend:sdk:.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
